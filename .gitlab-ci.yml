deploy:
  stage: deploy
  only:
    - 'master'
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY $VPS2_SSH_CONNECTION "
        cd /opt/ubbedigital_app/web-app &&
        git checkout . &&
        git checkout master &&
        git pull origin master &&
        npm run build &&
        rm -rf /opt/web_apps/ubbedigital/ &&
        cp -r dist/ubbe-digital /opt/web_apps/ubbedigital/ &&
        docker restart nginx"
