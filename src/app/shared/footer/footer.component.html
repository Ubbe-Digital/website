<footer>
  <hr/>

  <div class="container">
    <div class="row">

      <div class="col-xs-6 col-md-3">
        <h6>Productos</h6>
        <ul>
          <li *ngFor="let product of products">
            <a [href]="product.path">{{ product.name }}</a>
          </li>
        </ul>
      </div>

      <div class="col-xs-6 col-md-3">
        <h6>Servicios</h6>
        <ul>
          <li *ngFor="let service of services">
            <a [href]="service.path">{{ service.name }}</a>
          </li>
        </ul>
      </div>

      <div class="col-xs-6 col-md-3">
        <h6>Enlaces de interes</h6>
        <ul class="footer-links">
          <li><a href="/docs">Documentación</a></li>
          <li><a href="/blog">Blog</a></li>
          <li><a [routerLink]="['/']" fragment="about-us">Conócenos</a></li>
          <li><a [routerLink]="['/']" fragment="contact-us">Contáctanos</a></li>
        </ul>
      </div>

      <div class="col-sm-6 col-md-3">
        <h6>Redes Sociales</h6>
        <a *ngFor="let item of rrss" [href]="item.url" target="_blank" style="font-size: 40px; padding: 5px;" rel="noreferrer">
          <i [class]="item.fa_icon"></i>
        </a>
      </div>

    </div>
    <hr/>
  </div>
  
  <!-- Copyright !-->
  <div class="container">
    <div class="row">
      <div class="col-md-8 col-sm-6 col-xs-12">
        <p class="copyright-text">2024 Copyright &copy; <a href="https://ubbedigital.com">Servicios Ubee Digital C.A.</a></p>
      </div>
    </div>
  </div>
  
</footer>
